<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Mise en page : en-tête collant, une colonne, onglets en bas. Chaque jour est un panneau bleu de signalisation avec liseré blanc. */
:root {
  --bg: #e8edf2; --card: #ffffff; --ink: #0e1b29; --mute: #58697a; --line: #d2dae3; --soft: #f0f3f7;
  --sign: #0b4a97; --sign-ink: #ffffff; --accent: #0b4a97;
  --warn: #8a5200; --warn-bg: #fff0cf; --bad: #b4162a; --bad-bg: #fde4e7; --ok: #146c3e; --ok-bg: #d9f1e4; --info: #2f4f70; --info-bg: #e3edf7;
  --deck: #cdd6df; --cell-empty: #e1e7ed; --shadow: 0 1px 2px rgba(14,27,41,.08);
  --f-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1119; --card: #141e29; --ink: #e7eef5; --mute: #8da0b3; --line: #243346; --soft: #1a2634;
    --sign: #14549f; --accent: #6aa8f0;
    --warn: #f2b445; --warn-bg: #3a2c0c; --bad: #ff8592; --bad-bg: #40131b; --ok: #55c98e; --ok-bg: #10341f; --info: #9bbbe0; --info-bg: #17283b;
    --deck: #223245; --cell-empty: #1b2938; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1119; --card: #141e29; --ink: #e7eef5; --mute: #8da0b3; --line: #243346; --soft: #1a2634;
  --sign: #14549f; --accent: #6aa8f0;
  --warn: #f2b445; --warn-bg: #3a2c0c; --bad: #ff8592; --bad-bg: #40131b; --ok: #55c98e; --ok-bg: #10341f; --info: #9bbbe0; --info-bg: #17283b;
  --deck: #223245; --cell-empty: #1b2938; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.4 var(--f-body); padding-block: 0 calc(76px + env(safe-area-inset-bottom, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num, time, .tnum { font-variant-numeric: tabular-nums; }
.wrap { max-width: 640px; margin: 0 auto; }

/* en-tête */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding: 10px 0 8px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font: 700 26px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
.brand .sub { margin-left: auto; font-size: 12px; color: var(--mute); text-align: right; }
.sum { margin: 6px 0 0; font-size: 13.5px; color: var(--mute); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.sum b { color: var(--ink); font-weight: 600; }
.sum .bar { display: inline-flex; align-items: center; gap: 6px; }

/* onglets */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--card); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs button { background: none; border: 0; border-radius: 12px; padding: 6px 2px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font: 600 12px/1.1 var(--f-body); color: var(--mute); min-height: 54px; }
.tabs button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-selected="true"] { color: var(--accent); background: var(--info-bg); }

/* éléments communs */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 0 0 12px; box-shadow: var(--shadow); }
.card h2, h2.sec { font: 700 19px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 8px; }
.muted { color: var(--mute); }
.small { font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 0; min-width: 0; }
.btn { border: 0; background: var(--sign); color: #fff; border-radius: 12px; padding: 12px 16px; font-weight: 600; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.ghost { background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn.sm { min-height: 40px; padding: 8px 12px; font-size: 14px; }
.btn:disabled { opacity: .5; }
.btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 99px; font-size: 12.5px; font-weight: 600; background: var(--soft); color: var(--mute); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.info { background: var(--info-bg); color: var(--info); }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--mute); font-weight: 500; min-width: 0; }
input[type=text], input[type=number], input[type=date], input[type=time], select, textarea, input:not([type]) { width: 100%; min-height: 46px; border: 1px solid var(--line); background: var(--soft); border-radius: 10px; padding: 8px 12px; color: var(--ink); }
textarea { min-height: 90px; resize: vertical; }
input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--sign); }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; padding: 9px 4px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--mute); min-height: 42px; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.alert { border-radius: 10px; padding: 9px 12px; font-size: 14px; display: flex; gap: 8px; margin: 6px 0; line-height: 1.3; }
.alert.bad { background: var(--bad-bg); color: var(--bad); }
.alert.warn { background: var(--warn-bg); color: var(--warn); }
.alert.info { background: var(--info-bg); color: var(--info); }
.alert svg { flex: none; width: 20px; height: 20px; }
details.card > summary { font: 700 19px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 32px; }
details.card > summary::after { content: "+"; font-size: 24px; color: var(--mute); }
details.card[open] > summary::after { content: "–"; }
details.card[open] > summary { margin-bottom: 10px; }

/* jours */
.days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.dchip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 7px 12px; min-width: 74px; text-align: left; min-height: 52px; }
.dchip b { display: block; font: 700 20px/1 var(--f-display); }
.dchip span { font-size: 12px; color: var(--mute); }
.dchip[aria-selected="true"] { background: var(--sign); border-color: var(--sign); color: #fff; }
.dchip[aria-selected="true"] span { color: #dbe8fb; }
.sign { background: var(--sign); color: var(--sign-ink); border-radius: 14px; padding: 16px 18px; box-shadow: inset 0 0 0 3px var(--sign), inset 0 0 0 5px rgba(255,255,255,.92); margin-bottom: 10px; }
.sign .l1 { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sign .jn { font: 700 40px/1 var(--f-display); }
.sign .dt { font: 600 21px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.sign .l2 { margin-top: 6px; font-size: 15px; opacity: .95; display: flex; flex-wrap: wrap; gap: 2px 14px; }
.gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
.gauge { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }
.gauge .gl { font-size: 12px; color: var(--mute); display: flex; justify-content: space-between; }
.gauge .gv { font: 700 21px/1.1 var(--f-display); }
.gauge .gb { height: 6px; border-radius: 4px; background: var(--soft); margin-top: 6px; overflow: hidden; }
.gauge .gb i { display: block; height: 100%; background: var(--ok); border-radius: 4px; }
.gauge.warn .gb i { background: #e0a21a; } .gauge.bad .gb i { background: var(--bad); }

/* chronologie */
.tl { list-style: none; margin: 0; padding: 0; }
.ev { display: grid; grid-template-columns: 54px 1fr; gap: 0 16px; position: relative; padding-bottom: 10px; }
.ev::before { content: ""; position: absolute; left: 62px; top: 22px; bottom: -2px; width: 2px; background: var(--line); }
.ev:last-child::before { display: none; }
.ev > time { font: 600 16px/1.3 var(--f-body); text-align: right; padding-top: 10px; }
.ev .b { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; position: relative; }
.ev .b::before { content: ""; position: absolute; left: -17px; top: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--line); border: 2px solid var(--bg); }
.ev.line .b { background: none; border: 0; padding: 4px 0 4px 2px; color: var(--mute); font-size: 14px; }
.ev.line .b::before { display: none; }
.ev.line { padding-bottom: 4px; }
.ev.line > time { padding-top: 4px; }
.ev.stop .b::before { background: var(--sign); }
.ev.hub .b { border: 2px dashed var(--sign); background: var(--info-bg); }
.ev.hub .b::before { background: var(--sign); }
.ev.brk .b { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.ev.brk .b::before { background: var(--warn); }
.stoptop { display: flex; gap: 10px; align-items: flex-start; }
.badge { flex: none; width: 38px; height: 38px; border-radius: 10px; background: var(--c, #555); color: #fff; font: 700 21px/38px var(--f-display); text-align: center; }
.badge.sm { width: 28px; height: 28px; line-height: 28px; font-size: 16px; border-radius: 8px; }
.st-name { font-weight: 700; font-size: 17px; line-height: 1.2; overflow-wrap: anywhere; }
.st-sub { font-size: 14px; color: var(--mute); overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.acts .btn { flex: 1 1 auto; white-space: nowrap; }
.done .st-name { text-decoration: line-through; opacity: .6; }
.gapb { text-align: center; font-size: 13px; color: var(--mute); border: 1px dashed var(--line); border-radius: 12px; padding: 8px; margin-bottom: 10px; }

/* camion */
.veh { margin-bottom: 14px; }
.veh-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.veh-h b { font: 700 19px/1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; }
.deckw { display: grid; grid-template-columns: 30px minmax(0, 1fr) 14px; gap: 4px; align-items: stretch; }
.cab { background: var(--deck); border-radius: 10px 4px 4px 10px; display: grid; place-items: center; font: 700 11px var(--f-display); letter-spacing: .08em; color: var(--mute); writing-mode: vertical-rl; transform: rotate(180deg); }
.doors { background: repeating-linear-gradient(0deg, var(--mute) 0 4px, transparent 4px 8px); opacity: .55; border-radius: 3px; }
.deck { display: grid; gap: 3px; background: var(--deck); padding: 4px; border-radius: 6px; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); }
.pal { aspect-ratio: 1 / 1.1; border-radius: 6px; border: 0; background: var(--c, var(--cell-empty)); color: #fff; font: 700 17px/1 var(--f-display); display: grid; place-items: center; position: relative; padding: 0; min-width: 0; }
.pal.empty { background: var(--cell-empty); border: 1px dashed var(--line); }
.pal.gone { background: transparent; border: 1px dashed var(--line); color: var(--mute); opacity: .6; }
.pal i { position: absolute; top: 1px; right: 3px; font: 700 11px/1 var(--f-body); font-style: normal; }
.pal em { position: absolute; bottom: 1px; left: 3px; font: 700 10px/1 var(--f-body); font-style: normal; opacity: .9; }
.pal.sel { outline: 3px solid var(--ink); outline-offset: 1px; z-index: 1; }
.pal.dim { opacity: .35; }
.ranks { display: grid; grid-template-columns: 30px minmax(0, 1fr) 14px; gap: 4px; margin-top: 3px; font-size: 10.5px; color: var(--mute); }
.ranks div:nth-child(2) { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); padding: 0 4px; text-align: center; gap: 3px; }
.kgbar { height: 6px; background: var(--soft); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.kgbar i { display: block; height: 100%; background: var(--ok); }
.kgbar.warn i { background: #e0a21a; } .kgbar.bad i { background: var(--bad); }
.legend { display: grid; gap: 6px; }
.lg { display: flex; gap: 10px; align-items: center; background: var(--soft); border-radius: 10px; padding: 7px 10px; border: 2px solid transparent; text-align: left; width: 100%; }
.lg.sel { border-color: var(--ink); }
.lg .t { min-width: 0; flex: 1; }
.lg .t b { display: block; font-size: 15px; overflow-wrap: anywhere; line-height: 1.2; }
.lg .t span { font-size: 12.5px; color: var(--mute); }

/* clients */
.cli { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cli:last-child { border-bottom: 0; }
.cli .t { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; }
.cli .t b { display: block; font-size: 16px; overflow-wrap: anywhere; line-height: 1.2; }
.cli .t span { font-size: 13px; color: var(--mute); }
.mv { display: flex; flex-direction: column; gap: 4px; }
.mv button { width: 36px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--soft); line-height: 1; }
.dash { border: 2px dashed var(--line); border-radius: 14px; padding: 16px; text-align: center; color: var(--mute); }

/* feuille modale */
.back { position: fixed; inset: 0; background: rgba(5,12,20,.55); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--card); border-radius: 18px 18px 0 0; max-height: 92%; overflow-y: auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 -8px 30px rgba(0,0,0,.35); }
.sheet .wrap { display: grid; gap: 12px; }
.sheet h3 { font: 700 22px/1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; margin: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; z-index: 60; max-width: 92%; text-align: center; }
.pre { white-space: pre-wrap; font: 13px/1.4 ui-monospace, Menlo, monospace; background: var(--soft); border-radius: 10px; padding: 10px; overflow-x: auto; }
.spin { width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp 0.8s linear infinite; display: inline-block; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dow button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); font-weight: 600; }
.dow button[aria-pressed="true"] { background: var(--sign); color: #fff; border-color: var(--sign); }
.tog { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; }
.tog span { min-width: 0; }
.tog small { display: block; color: var(--mute); font-size: 12.5px; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 100px; min-height: 0; padding: 0; border: 0; }
hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="14.5" fill="#fff" stroke="#c8202f" stroke-width="4"/><path d="M8 21v-6h9v-2h5l3 3v5h-1.5a2.2 2.2 0 0 0-4.4 0h-6.2a2.2 2.2 0 0 0-4.4 0z" fill="#111"/></svg>
      <h1>Tournée PL</h1>
      <div class="sub" id="hsub"></div>
    </div>
    <div class="sum" id="hsum"></div>
  </header>
  <main id="main" aria-live="polite"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-tab="plan" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="6" cy="5" r="2.2"/><circle cx="18" cy="12" r="2.2"/><circle cx="6" cy="19" r="2.2"/><path d="M8 5h5a4 4 0 0 1 0 8H8m0 0a3.5 3.5 0 0 0 0 6h0"/></svg>Plan</button>
  <button data-tab="cam" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M2 17V8h9v9M11 11h5l3 3v3M2 17h2m3 0h8m3 0h2"/><circle cx="5.5" cy="17.5" r="1.6"/><circle cx="17.5" cy="17.5" r="1.6"/></svg>Camion</button>
  <button data-tab="cli" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>Clients</button>
  <button data-tab="set" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M4 12h4M12 12h8"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/><circle cx="10" cy="12" r="2" opacity="0"/></svg>Réglages</button>
</nav>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script>

function parsePlace(txt) {
  let t = ' ' + String(txt || '') + ' ';
  const m = t.match(/\b(\d{5})\b/);
  const cp = m ? m[1] : '';
  if (m) t = t.replace(m[0], ' ');
  const dm = t.match(/\((\d{2,3})\)/);
  const dept = dm ? dm[1] : (cp ? cp.slice(0, 2) : '');
  t = t.replace(/\(.*?\)/g, ' ');
  return { name: norm(t), cp, dept };
}
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  const m = a.length, n = b.length; let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }

}

  return list.slice().sort((x, y) => {
    const sx = (cp && x.cp === cp ? 4 : 0) + (dept && x.cp.startsWith(dept) ? 2 : 0);
    const sy = (cp && y.cp === cp ? 4 : 0) + (dept && y.cp.startsWith(dept) ? 2 : 0);
    return sy - sx || y.pop - x.pop;

}
/* Communes trouvées en ligne : WEB = cette session (suggestions), S.geoCache = gardées sur l'appareil */
const WEB = new Map();
const placeKey = c => norm(c.nom) + '|' + (c.cp || '');
function allPlaces() {
  const out = COM.slice(), seen = new Set(COM.map(placeKey));

    if (!g || !isFinite(+g.lat) || !isFinite(+g.lon) || g.lat === null || g.lon === null) return;
    const key = placeKey(g); if (seen.has(key)) return; seen.add(key);
    out.push({ nom: g.nom, cp: g.cp || '', lat: +g.lat, lon: +g.lon, pop: g.pop || 1, k: norm(g.nom), web });
  };

}

function findCommune(txt) {
  const { name, cp, dept } = parsePlace(txt);
  if (!name && !cp) return null;
  const all = allPlaces();
  let c = [];
  if (name) {
    c = all.filter(x => x.k === name);
    if (!c.length) {
      const words = name.split(' ');
      for (let n = Math.min(words.length, 4); n >= 1 && !c.length; n--) {
        const suf = words.slice(-n).join(' ');
        c = all.filter(x => x.k === suf);
      }
    }
    if (!c.length && name.length >= 3) c = all.filter(x => x.k.startsWith(name));
    if (!c.length && name.length >= 4) c = all.filter(x => (' ' + x.k + ' ').includes(' ' + name + ' '));
    if (!c.length && name.length >= 5) {

/* ---------- géométrie ---------- */
function hav(a, b) {
  const r = Math.PI / 180, dl = (b.lat - a.lat) * r, dn = (b.lon - a.lon) * r;
  const x = Math.sin(dl / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dn / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(x));
}
function distPointSeg(p, a, b) {
  const kx = 111.32 * Math.cos(p.lat * Math.PI / 180), ky = 110.57;
  const ax = (a.lon - p.lon) * kx, ay = (a.lat - p.lat) * ky, bx = (b.lon - p.lon) * kx, by = (b.lat - p.lat) * ky;
  const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
  let t = L ? -(ax * dx + ay * dy) / L : 0; t = clamp(t, 0, 1);
  return Math.hypot(ax + t * dx, ay + t * dy);

    if (prevEnd != null) { const earliest = prevEnd + D.restH * 60 - 1440 * (1 + (gaps[d] || []).length); if (earliest > startNominal) { startMin = Math.ceil(earliest / 5) * 5; restNote = `Départ décalé à ${hhmm(startMin)} pour respecter ${D.restH} h de repos.`; } }
    const snap = { P: state.P.slice(), R: state.R.slice() };
    const r = simDay({ start: prevLoc, list, endDepot: d === nd - 1 && D.returnDepot, startMin, state, PS, emit: true, dateIso: dates[d], first: d === 0 });
    const day = { idx: d, date: dates[d], startMin, endMin: r.end, amp: r.amp, drive: r.drive, km: r.km, wait: r.wait, events: r.events, di: list.map(s => s.di), warns: [], snap, restNote, nightPlace: r.endLoc.label || r.endLoc.ville || '', late: r.late };
    if (restNote) day.warns.push({ lvl: 'info', text: restNote });
    if (r.drive > D.maxDrive) day.warns.push({ lvl: r.drive <= D.maxDrive + 60 ? 'warn' : 'bad', text: `Conduite ${dur(r.drive)} : au-delà de ${dur(D.maxDrive)}${r.drive <= 600 ? " (10 h tolérées 2 fois par semaine)" : ''}.` });

    if (r.late) day.warns.push({ lvl: 'warn', text: `${r.late} client(s) arrivé(s) hors créneau d'ouverture.` });
    const bn = banIn(dates[d], startMin, r.end); if (bn) day.warns.push({ lvl: 'bad', text: `Circulation interdite aux PL : ${bn}.` });

  plan.finalState = state;

}

const isOnline = () => navigator.onLine !== false;
async function fetchJson(url, ms = 8000) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);

  finally { clearTimeout(t); }

async function geocodeAddr(s) {
  const q = [s.adresse, s.cp, s.ville].filter(Boolean).join(' ').trim();
  if (q.length < 3) return null;
  let url = 'https://api-adresse.data.gouv.fr/search/?limit=1&q=' + encodeURIComponent(q.slice(0, 200));
  if (/^\d{5}$/.test(s.cp || '')) url += '&postcode=' + s.cp;
  const j = await fetchJson(url), f = j && j.features && j.features[0];

  const [lon, lat] = f.geometry.coordinates, pr = f.properties;

}
async function searchCommunesOnline(txt, max = 6) {
  const { name, cp } = parsePlace(txt);
  const f = '&fields=nom,codesPostaux,centre,population&boost=population&limit=' + max;
  let url = null;
  if (name.length >= 2) url = 'https://geo.api.gouv.fr/communes?nom=' + encodeURIComponent(name) + (cp ? '&codePostal=' + cp : '') + f;
  else if (cp) url = 'https://geo.api.gouv.fr/communes?codePostal=' + cp + f;
  if (!url) return [];
  let arr = await fetchJson(url, 6000);
  if (cp && name && (!Array.isArray(arr) || !arr.length)) arr = await fetchJson('https://geo.api.gouv.fr/communes?nom=' + encodeURIComponent(name) + f, 6000);
  const out = (Array.isArray(arr) ? arr : []).filter(c => c.centre && c.centre.coordinates).map(c => ({
    nom: c.nom, cp: (c.codesPostaux || []).find(x => cp && x === cp) || (c.codesPostaux || [])[0] || '',
    lat: c.centre.coordinates[1], lon: c.centre.coordinates[0], pop: Math.max(1, Math.round((c.population || 0) / 1000)), k: norm(c.nom), web: true
  }));
  out.forEach(c => WEB.set(placeKey(c), c));

}
/* Commune connue localement, sinon recherchée en ligne. */
async function findCommuneAny(txt) {
  const c = findCommune(txt); if (c && !c.fuzzy) return c;
  // orthographe seulement proche : jamais acceptée d'office (« Châteaulin » n'est pas « Châteaudun »)
  if (!isOnline()) return null;
  try { await searchCommunesOnline(txt, 5); } catch (e) { return null; }

}
/* Localise en ligne : adresse précise si possible, sinon centre de la commune. */
const MISSED = new Set();   // recherches sans résultat pendant cette session
async function onlineLocate(list, { refine = false } = {}) {
  if (!list.length || !isOnline()) return 0;
  let n = 0;
  for (const s of list) {
    try {
      if (s.adresse) {
        const r = await geocodeAddr(s);
        if (r && (r.precise || !isFinite(s.lat))) {
          s.lat = r.lat; s.lon = r.lon; s.geo = r.precise ? 'adresse' : 'commune';
          if (!s.cp) s.cp = r.cp; if (!s.ville) s.ville = r.nom; n++; continue;
        }
      }
      if (refine || isFinite(s.lat)) continue;
      // « Bricolage Plouha » : la ville est souvent à la fin, on essaie aussi les derniers mots
      const words = String(s.ville || s.nom).trim().split(/\s+/);
      const tries = [words.join(' ')];
      for (let k = Math.min(3, words.length - 1); k >= 1; k--) tries.push(words.slice(-k).join(' '));
      let c = null;
      for (const t of tries) { if (t.length < 3 || MISSED.has(t + '|' + s.cp)) continue; c = await findCommuneAny([t, s.cp].filter(Boolean).join(' ')); if (c) break; MISSED.add(t + '|' + s.cp); }
      if (c) { remember(c); s.lat = c.lat; s.lon = c.lon; s.geo = 'commune'; s.ville = c.nom; if (!s.cp) s.cp = c.cp; n++; }
    } catch (e) { /* réseau indisponible : on garde la position actuelle */ }
  }
  return n;
}
/* Après un ajout : affine les adresses et cherche les villes inconnues, sans bloquer l'écran. */
async function locateLater(list, quiet) {
  const miss = list.filter(s => !isFinite(s.lat)), adr = list.filter(s => isFinite(s.lat) && s.adresse && s.geo !== 'adresse');
  if ((!miss.length && !adr.length) || !isOnline()) {
    if (miss.length && !quiet) toast(miss.length > 1 ? `${miss.length} villes inconnues hors ligne : à préciser` : 'Ville inconnue hors ligne : à préciser dans la fiche');
    return;
  }
  const found = await onlineLocate(miss);
  const ref = await onlineLocate(adr, { refine: true });
  if (found || ref) { save(); recompute(); }
  if (!quiet) {
    const still = miss.length - found;
    if (still) toast(`${still} ville(s) introuvable(s) : précise-les dans la fiche`);
    else if (found) toast(found > 1 ? `${found} positions trouvées en ligne` : 'Position trouvée en ligne');
  }
}

async function shrink(file, max = 1800) {
  const toBlob = c => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encodage impossible')), 'image/jpeg', 0.82));
  const draw = (src, w, h) => {
    const r = Math.min(1, max / Math.max(w, h)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * r)); c.height = Math.max(1, Math.round(h * r));
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); return c;
  };
  const loadImg = src => new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error("décodage refusé")); img.src = src; });
  const errs = [];
  // 1. décodage directement réduit (indispensable pour les photos 50 ou 200 Mpx)
  if (window.createImageBitmap) {
    for (const opts of [{ resizeWidth: 2000, resizeQuality: 'medium' }, { resizeHeight: 2000, resizeQuality: 'medium' }, null]) {
      try {
        const bm = opts ? await createImageBitmap(file, opts) : await createImageBitmap(file);
        const c = draw(bm, bm.width, bm.height); if (bm.close) bm.close();
        return await toBlob(c);
      } catch (e) { errs.push('bitmap ' + ((e && e.message) || e)); }
    }
  }
  // 2. élément image via URL locale
  try {
    const url = URL.createObjectURL(file);
    try { const img = await loadImg(url); return await toBlob(draw(img, img.naturalWidth || img.width, img.naturalHeight || img.height)); } finally { URL.revokeObjectURL(url); }
  } catch (e) { errs.push('image ' + e.message); }
  // 3. lecture en data URL
  try {
    const data = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error('lecture')); fr.readAsDataURL(file); });
    const img = await loadImg(data); return await toBlob(draw(img, img.naturalWidth || img.width, img.naturalHeight || img.height));
  } catch (e) { errs.push('data ' + e.message); }
  // 4. fichier brut s'il est assez léger
  if (file.size <= 4.5e6 && /^image\/(jpeg|png|webp|gif)$/.test(file.type)) return file;
  throw new Error(`Photo illisible (${file.type || 'type inconnu'}, ${(file.size / 1e6).toFixed(1).replace('.', ',')} Mo). Règle l'appareil photo sur une définition plus basse (12 Mpx) ou utilise la photo depuis la galerie. Détail : ${errs.join(' ; ')}`);
}

/* Une ligne par client, ou un bloc par client séparé par une ligne vide. */
function parseList(text) {
  const raw = String(text || '').replace(/\r/g, '').replace(/[\t|]+/g, ', ');
  const blocks = raw.split(/\n\s*\n/).map(b => b.split('\n').map(x => x.trim()).filter(Boolean));
  const blockMode = blocks.length > 1 && blocks.some(b => b.length > 1);
  const entries = blockMode ? blocks.map(b => b.join(', ')) : raw.split('\n').map(x => x.trim());
  // titres et lignes de tableau qui ne sont pas des clients
  const HEADER = /^(?:bon de (?:livraison|transport|commande)|feuille de (?:route|tourn[ée]e)|tourn[ée]e|bordereau|lettre de voiture|cmr|date|total|totaux|client|clients|destinataire|adresse|d[ée]signation|quantit[ée]|page|n°|signature|chauffeur|v[ée]hicule|immatriculation)\b/i;
  return entries
    .map(l => l.replace(/^\s*(?:\d{1,2}\s*[.)-]\s+|[-•*·]\s*)/, ''))   // « 1. », « - », puces
    .filter(l => /[a-zà-ÿ]{2}/i.test(l) && l.length >= 3)
    .filter(l => !(HEADER.test(l) && !/\d/.test(l)))
    .filter(l => !(blockMode && !/\d/.test(l) && !l.includes(',')))   // bloc d'une seule ligne sans chiffre : un titre
    .map(parseQuick)

}

function removeDemo() {

/* ---------- saisie rapide ---------- */
function parseQuick(line) {
  let t = ' ' + String(line || '').replace(/\s+/g, ' ').trim() + ' ';
  const take = (re, fn, rep = ' ') => { const m = t.match(re); if (m) { t = t.replace(m[0], rep); return fn(m); } return null; };
  // « 8h-12h », « 7h30 à 12h », « 13:30-17:00 » ; heures au format HH:MM pour les champs horaires
  const WIN = /(?<!\d)(\d{1,2})\s*(?:[h:](\d{2})?|h)\s*(?:-|–|à|a)\s*(\d{1,2})\s*(?:[h:](\d{2})?|h)?(?!\d)/i;
  const hm = (h, m) => { const x = tmin(`${h}:${m || '00'}`); return x == null ? '' : hhmm(x); };
  const toWin = m => [hm(m[1], m[2]), hm(m[3], m[4])];
  const win = take(WIN, toWin);
  const win2 = win ? take(WIN, toWin) : null;
  // « 1 200 kg » ou « 800kg », sans avaler un code postal placé juste avant (« 53000 800 kg »)
  const kg = take(/(?<!\d)(\d{1,3}(?:[   .]\d{3})+|\d+)\s*kg\b/i, m => +m[1].replace(/[\s.  ]/g, ''));
  const hautes = take(/(\d+)\s*(?:pal(?:ettes?)?\s*)?(?:hautes?|grandes?)\b/i, m => +m[1]);
  const pal = take(/(\d+)\s*(?:pal(?:ettes?)?\b|p\b)/i, m => +m[1]);
  const mode = /porteur\s*seul/i.test(t) ? 'seul' : 'auto';
  t = t.replace(/porteur\s*seul/i, ' ');
  // code postal : remplacé par un repère pour séparer « nom » et « ville » sur une ligne sans virgule
  const cp = take(/(?<!\d)(\d{5})(?!\d)/, m => m[1], ' \u0001 ');
  const parts = t.split(/[,;\n]/).map(x => x.replace(/\s+/g, ' ').trim()).filter(x => x && x !== '\u0001');
  let nom = '', adresse = '', ville = '';
  const clean = x => x.replace(/\u0001/g, ' ').replace(/\s+/g, ' ').trim();
  const cpPart = parts.findIndex(x => x.includes('\u0001'));
  if (parts.length === 1 && cpPart === 0) {
    const [bef, aft] = parts[0].split('\u0001').map(clean);
    nom = bef || aft; ville = aft || bef;
  } else if (parts.length >= 3) {
    const vi = cpPart >= 1 ? cpPart : parts.length - 1;
    nom = clean(parts[0]); ville = clean(parts[vi]);
    adresse = parts.slice(1).filter((_, i) => i + 1 !== vi).map(clean).join(', ');
  } else if (parts.length === 2) { nom = clean(parts[0]); ville = clean(parts[1]); }
  else if (parts.length === 1) { nom = clean(parts[0]); ville = nom; }
  // dans « 12 rue X 35500 Vitré » la partie ville peut contenir l'adresse : on garde ce qui suit le CP
  if (cpPart >= 0 && parts[cpPart] && parts.length > 1) {
    const [bef, aft] = parts[cpPart].split('\u0001').map(clean);
    if (aft) { ville = aft; if (bef && cpPart > 0) adresse = [adresse, bef].filter(Boolean).join(', '); }
  }
  return newStop({ nom, adresse, ville, cp: cp || '', pal: pal ?? 1, hautes: Math.min(hautes ?? 0, pal ?? 1), kg: kg ?? 0,
    o1: win ? win[0] : '', c1: win ? win[1] : '', o2: win2 ? win2[0] : '', c2: win2 ? win2[1] : '', mode, check: pal == null });
}

/* ---------- vue Plan ---------- */
function emptyCard() {
  return `<div class="card"><h2>Aucun client</h2><p class="muted">Ajoute les clients de la semaine : photo de la feuille de route, saisie rapide ou formulaire.</p><div class="row"><button class="btn grow" data-act="goto" data-tab="cli">Ajouter des clients</button><button class="btn ghost grow" data-act="demo">Voir l'exemple</button></div></div>`;

function viewPlan() {

  h += `<p class="small muted" style="margin-top:12px">Distances à vol d'oiseau × ${String(D.coef).replace('.', ',')} et positions au centre des communes (ou à l'adresse quand elle a été trouvée) : l'app propose un ordre et des horaires, pas un itinéraire. Pour rouler, utilise un GPS poids lourd réglé sur ${m2(D.H)} m, ${m2(D.W)} m et ${D.PTRA} t. Arrêtés locaux et ponts bas : ajoute-les dans Réglages, ils sont signalés sur le trajet.</p>`;

function navLinks(s) {

function evHtml(e, day) {
  const D = S.settings, PS = S.plan.PS;

    case 'depart': return `<li class="ev"><time class="num">${hhmm(e.t)}</time><div class="b"><b>Départ</b> · ${esc(e.place)}${e.first ? '' : '<div class="small muted">Reprise après la nuit</div>'}</div></li>`;

      let h = e.km < 0.5 ? '' : `<li class="ev line"><time class="num">${hhmm(e.t0)}</time><div class="b">${lbl ? lbl + ' · ' : ''}${fmt(e.km)} km · ${dur(mins)} vers ${esc(placeName(e.to))}</div></li>`;

    }

    }
    case 'transfer': {
      const g = e.moved.map(s => `<span class="badge sm" style="--c:${col(s.di)}">${s.di + 1}</span>`).join(' ');
      return `<li class="ev hub"><time class="num">${hhmm(e.t)}</time><div class="b"><b>Passerelle : remorque → porteur</b><div class="small">${e.pal} palette${e.pal > 1 ? 's' : ''} à transvaser, premier chargé = dernier livré${e.repack ? ` · ${e.repack} pal à re-arrimer` : ''} · ${dur(e.dur)}</div><div class="chips">${g}</div></div></li>`;
    }
    case 'reprise': return `<li class="ev hub"><time class="num">${hhmm(e.t)}</time><div class="b"><b>Reprendre la remorque</b> · ${esc(e.place)}<div class="small">Atteler (${dur(e.dur)})${e.loops > 1 ? ' · ' + e.loops + ' tournées porteur' : ''}</div></div></li>`;

    default: return '';
  }
}

/* ---------- vue Camion ---------- */
function posText(lay, di, capRows) {
  const rows = [];
  lay.cells.forEach((r, ri) => r.forEach(c => { if (c && c.di === di) rows.push(ri + 1); }));
  if (!rows.length) return '';
  const a = Math.min(...rows), b = Math.max(...rows);
  return a === b ? `rang ${a}` : `rangs ${a}–${b}`;
}
function deckHtml(lay, rows, state, name) {
  const p = S.plan;

  for (let lane = 0; lane < 2; lane++) for (let c = 0; c < rows; c++) {
    const cell = lay.cells[rows - 1 - c][lane];
    if (!cell) { h += '<div class="pal empty"></div>'; continue; }

  }
  h += `</div><div class="doors" title="Portes"></div></div><div class="ranks"><div></div><div style="--cols:${rows}">${Array.from({ length: rows }, (_, c) => `<span>${rows - c}</span>`).join('')}</div><div></div></div>`;

function suggestInto(input, dl, after) {
  let timer = 0, lastQ = '';
  const render = () => { if (dl) dl.innerHTML = suggestCommunes(input.value).map(x => `<option value="${esc(x.nom)}">${esc(x.cp)}</option>`).join(''); };
  input.addEventListener('input', () => {
    render(); if (after) after();
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 3 || !isOnline() || q === lastQ) return;
    timer = setTimeout(async () => {
      lastQ = q;
      try { await searchCommunesOnline(q, 8); } catch (e) { return; }
      if (input.value.trim() === q) { render(); if (after) after(); }
    }, 350);
  });
  render();

document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, D = S.settings;
  switch (a) {
    case 'close': closeSheet(); break;
    case 'goto': setTab(t.dataset.tab); break;
    case 'day': S.day = +t.dataset.i; renderMain(); break;
    case 'snap': S.camSnap = +t.dataset.i; renderMain(); break;
    case 'selpal': { const di = +t.dataset.di; S.selStop = S.selStop === di ? null : di; renderMain(); break; }
    case 'done': {
      const id = t.dataset.id;
      if (S.done[id]) delete S.done[id];
      else {
        const day = S.plan && S.plan.days ? (S.plan.days[S.day] || S.plan.days[0]) : null;
        if (!day) break;
        const n = new Date();
        S.done[id] = { date: day.date, min: day.date === todayIso() ? n.getHours() * 60 + n.getMinutes() : +t.dataset.te };
      }
      save(); recompute(); break;
    }
    case 'copyday': if (S.plan && S.plan.days) copyText(dayText(S.plan, S.day)); break;
    case 'copyload': if (S.plan && S.plan.PS) copyText(loadText(S.plan)); break;
    case 'edit': openStop(t.dataset.id); break;
    case 'new': openStop(''); break;
    case 'savestop': await saveStop(t.dataset.id); break;
    case 'delstop':
      if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Confirmer'; break; }
      S.stops = S.stops.filter(s => s.id !== t.dataset.id); delete S.done[t.dataset.id]; save(); closeSheet(); recompute(); break;
    case 'quick': await doQuick(); break;
    case 'paste': openPaste(''); break;
    case 'runpaste': { const v = $('#pt').value.trim(); if (!v) break; closeSheet(); if (S.tab !== 'cli') setTab('cli'); runPasteText(v); break; }
    case 'install': await doInstall(); break;
    case 'validall': S.stops.forEach(s => { s.check = false; }); save(); renderMain(); break;
    case 'order':
      if (t.dataset.v === 'manual' && S.plan && S.plan.PS) { const m = {}; S.plan.PS.forEach(s => { m[s.id] = s.di; }); S.stops.sort((x, y) => (m[x.id] ?? 999) - (m[y.id] ?? 999)); }
      D.order = t.dataset.v; save(); recompute(); break;
    case 'mv': { const i = S.stops.findIndex(s => s.id === t.dataset.id), j = i + +t.dataset.d; if (i >= 0 && j >= 0 && j < S.stops.length) { [S.stops[i], S.stops[j]] = [S.stops[j], S.stops[i]]; save(); recompute(); } break; }
    case 'clear': S.stops = S.stops.filter(s => !s.demo); S.demo = false; S.done = {}; save(); recompute(); toast('Liste vidée'); break;
    case 'demo': S.stops = demoStops(); S.demo = true; S.done = {}; D.order = 'auto'; save(); S.day = 0; recompute(); setTab('plan'); break;
    case 'wd': { const d = +t.dataset.d, i = D.workdays.indexOf(d); if (i >= 0) { if (D.workdays.length > 1) D.workdays.splice(i, 1); } else D.workdays.push(d); t.setAttribute('aria-pressed', String(D.workdays.includes(d))); save(); S.plan = safePlan(); renderHeader(); break; }
    case 'addr': openSheet('Nouvelle restriction', restrForm()); { const v = $('#r-ville'); suggestInto(v, $('#dl-r'), () => { const c = findCommune(v.value); $('#r-geo').textContent = c ? `Position : ${c.nom} (${c.cp})` : ''; }); } break;
    case 'saver': {
      const val = parseFloat($('#r-val').value.replace(',', '.')), type = $('#r-type').value;
      const c = await findCommuneAny($('#r-ville').value);
      if (!c) { toast(isOnline() ? 'Commune introuvable' : 'Commune inconnue hors ligne : choisis-en une proche'); break; }
      if (c.web) remember(c);
      if (!['interdit', 'info'].includes(type) && !isFinite(val)) { toast('Indique la valeur'); break; }
      S.restr.push({ id: uid(), nom: $('#r-nom').value.trim(), lat: c.lat, lon: c.lon, type, val: isFinite(val) ? val : 0, rayon: parseFloat($('#r-ray').value.replace(',', '.')) || 3, note: $('#r-note').value.trim() });
      save(); closeSheet(); recompute(); renderMain(); toast('Restriction ajoutée'); break;
    }
    case 'delr': S.restr = S.restr.filter(r => r.id !== t.dataset.id); save(); recompute(); renderMain(); break;
    case 'export': {
      const data = JSON.stringify({ app: 'tournee-pl', version: 1, settings: S.settings, stops: S.stops, restr: S.restr, done: S.done, geoCache: S.geoCache, demo: S.demo }, null, 1);
      const name = `tournee-pl-${todayIso()}.json`, blob = new Blob([data], { type: 'application/json' });
      try {
        const file = new File([blob], name, { type: 'application/json' });
        if (navigator.canShare && navigator.share && /Android|iPhone|iPad/i.test(navigator.userAgent) && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Sauvegarde Tournée PL' }); toast('Sauvegarde partagée'); break; }
      } catch (e) { if (e && e.name === 'AbortError') { toast('Sauvegarde annulée'); break; } }
      const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500); toast('Sauvegarde téléchargée');
      break;
    }
    case 'reset':
      if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Confirmer'; break; }
      S.settings = DEFAULTS(); S.settings.date = firstWorkday(todayIso()); S.stops = []; S.restr = []; S.done = {}; S.demo = false; save(); recompute(); renderMain(); toast('Tout est effacé'); break;
  }
});
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) setTab(b.dataset.tab); });

/* ---------- installation et hors ligne ---------- */
const PWA = { prompt: null, sw: false, installed: false };
function isStandalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function setupPwa() {
  PWA.installed = isStandalone();
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.prompt = e; if (S.tab === 'set') renderMain(); });
  window.addEventListener('appinstalled', () => { PWA.installed = true; PWA.prompt = null; toast('Application installée'); if (S.tab === 'set') renderMain(); });
  window.addEventListener('online', () => { toast('Connexion retrouvée'); locateLater(S.stops.filter(s => !isFinite(s.lat)), true); });
  window.addEventListener('offline', () => toast('Hors ligne : l\'app continue de fonctionner'));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      PWA.sw = true;
      reg.addEventListener('updatefound', () => {
        const w = reg.installing; if (!w) return;
        w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) toast('Nouvelle version prête : rouvre l\'app'); });
      });
      if (S.tab === 'set') renderMain();
    }).catch(() => {});
  }
  // villes restées inconnues après une saisie hors ligne
  if (isOnline()) setTimeout(() => locateLater(S.stops.filter(s => !isFinite(s.lat)), true), 1500);
}
async function doInstall() {
  if (!PWA.prompt) return;
  PWA.prompt.prompt();
  try { const r = await PWA.prompt.userChoice; if (r && r.outcome === 'accepted') PWA.installed = true; } catch (e) { /* ignoré */ }
  PWA.prompt = null; renderMain();
}
function installCard() {
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  let body;
  if (PWA.installed) body = '<p class="small muted" style="margin:0">Application installée : elle s\'ouvre depuis l\'écran d\'accueil et marche sans réseau.</p>';
  else if (location.protocol === 'file:') body = '<p class="small muted" style="margin:0">Ouvert comme simple fichier : tout marche, mais pour installer l\'app et l\'utiliser hors ligne, lance-la avec le script <b>lancer</b> fourni (voir le fichier LISEZMOI).</p>';
  else if (PWA.prompt) body = '<p class="small muted" style="margin:0 0 8px">Ajoute Tournée PL comme une vraie application : icône, plein écran, fonctionnement hors ligne.</p><button class="btn" style="width:100%" data-act="install">Installer l\'application</button>';
  else if (ios) body = '<p class="small muted" style="margin:0">Sur iPhone : dans Safari, touche <b>Partager</b> puis <b>Sur l\'écran d\'accueil</b>.</p>';
  else body = '<p class="small muted" style="margin:0">Dans le menu du navigateur (⋮), choisis <b>Installer l\'application</b> ou <b>Ajouter à l\'écran d\'accueil</b>.</p>';
  const st = PWA.sw ? chip('Hors ligne prêt', 'ok') : location.protocol === 'file:' ? chip('Mode fichier', 'warn') : chip('Hors ligne en préparation');
  return `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">Application</h2>${st}</div>${body}<p class="small muted" style="margin:8px 0 0">${isOnline() ? 'En ligne : recherche des adresses et de toutes les communes de France activée.' : 'Hors ligne : villes de la base intégrée et villes déjà trouvées.'}</p></div>`;
}

/* ---------- démarrage ---------- */
(function init() {
  const had = load();
  const today = todayIso();
  if (!S.settings.date || S.settings.date < addD(today, -7)) S.settings.date = firstWorkday(today);
  if (!had) { S.stops = demoStops(); S.demo = true; S.settings.date = firstWorkday(today); }
  save();
  S.plan = safePlan();
  renderHeader(); renderMain();
  setupPwa();
})();

</script>
